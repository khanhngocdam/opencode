<!--
  The CoDev "C" mark in brand red #ee0033 on a white tile — the same geometry
  packages/desktop/icons/icon.svg draws, at half its scale: a 4x5 pixel grid
  with a one-unit stroke, unit = 60 of 512, mark 240x300 centered, corner
  radius 114.5 (229/1024 of the tile).

  Regenerate the raster siblings with `bun ./scripts/generate-icons.ts` from
  packages/desktop, which renders this same geometry.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="114.5" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="136" y="106" width="240" height="60" fill="#ee0033"/>
  <!-- left column -->
  <rect x="136" y="106" width="60" height="300" fill="#ee0033"/>
  <!-- bottom bar -->
  <rect x="136" y="346" width="240" height="60" fill="#ee0033"/>
</svg>
